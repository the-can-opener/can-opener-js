properties:
  Vehicle.Speed:
    aliases:
    - SPEED
    read:
      signal:
        dbc: main
        message: SPEED_BRAKE
        signal: SPEED_KMPH
  Vehicle.Powertrain.CombustionEngine.Speed:
    aliases:
    - RPM
    read:
      signal:
        channel: can0
        id: 23D
        id_format: standard
        length: 8
        decode:
          start_bit: 24
          bits: 16
          bit_order: lsb0
          type: uint
          scale: 3.15
          unit: rpm
  Vehicle.Chassis.SteeringWheel.Angle:
    aliases:
    - STEERING_ANGLE
    read:
      signal:
        channel: can0
        id: '2'
        id_format: standard
        length: 5
        decode:
          start_bit: 0
          bits: 16
          bit_order: lsb0
          type: int
          scale: 0.1
          unit: degrees
